<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rifa</title>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
:root{--b1:#6C2BD9;--t1:#FFF6D6;--b2:#FFD23F;--t2:#2B1055;--b3:#2EC4B6;--t3:#0B2B2A;--b4:#FFF1E0;--t4:#3A1C71;--b5:#E63977;--t5:#fff;
--ft:'Bungee',system-ui,sans-serif;--fx:'Nunito',system-ui,sans-serif}
*{box-sizing:border-box}
body{margin:0;font-family:var(--fx);font-size:18px;line-height:1.5;padding-bottom:90px}
section,header,footer{padding:clamp(28px,6vw,64px) clamp(16px,5vw,64px)}
.wrap{max-width:1000px;margin:auto}
h1,h2{font-family:var(--ft);font-weight:400;line-height:1.1;margin:0 0 .5em}
h1{font-size:clamp(2.2rem,8vw,5rem)}
h2{font-size:clamp(1.5rem,4vw,2.2rem)}
.s1{background:var(--b1);color:var(--t1)}.s2{background:var(--b2);color:var(--t2)}
.s3{background:var(--b3);color:var(--t3)}.s4{background:var(--b4);color:var(--t4)}.s5{background:var(--b5);color:var(--t5)}
.precio{display:inline-block;border:3px solid currentColor;border-radius:999px;padding:.2em 1em;font-weight:800;transform:rotate(-2deg)}
.desc{white-space:pre-line;font-size:1.25rem;max-width:60ch}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:20px}
.card{all:unset;box-sizing:border-box;cursor:pointer;background:#fff;color:#222;border-radius:18px;overflow:hidden;box-shadow:0 6px 0 rgba(0,0,0,.25);display:block}
.card:hover{transform:translateY(-3px) rotate(-1deg)}
.card:focus-visible,.num:focus-visible,button:focus-visible{outline:4px solid var(--t4);outline-offset:2px}
.card img{width:100%;aspect-ratio:3/2;object-fit:cover;display:block;background:#ddd}
.card b{display:block;padding:12px 16px;font-size:1.1rem}
.nums{display:grid;grid-template-columns:repeat(auto-fill,minmax(58px,1fr));gap:8px}
.num{font:800 1rem var(--fx);padding:12px 0;border-radius:10px;border:2px solid var(--t4);background:transparent;color:var(--t4);cursor:pointer}
.num.sel{background:var(--b5);color:var(--t5);border-color:var(--b5);transform:scale(1.08)}
.num.sold{opacity:.35;text-decoration:line-through;cursor:not-allowed;background:rgba(0,0,0,.08)}
.leyenda{display:flex;gap:16px;flex-wrap:wrap;margin-bottom:16px;font-size:.95rem}
.bar{position:fixed;left:0;right:0;bottom:0;z-index:5;padding:12px clamp(16px,5vw,64px);display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;box-shadow:0 -4px 0 rgba(0,0,0,.15)}
.btn{font:800 1rem var(--fx);border:0;border-radius:999px;padding:.7em 1.4em;cursor:pointer;background:var(--t5);color:var(--b5)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.btn.alt{background:transparent;color:inherit;border:2px solid currentColor}
dialog{border:0;border-radius:20px;padding:0;max-width:min(560px,94vw);width:100%;background:#fff;color:#222;font-family:var(--fx)}
dialog::backdrop{background:rgba(20,0,50,.6)}
dialog img{width:100%;display:block;max-height:50vh;object-fit:cover}
.dlg{padding:20px 24px 24px}
.x{float:right;font-size:1.6rem;background:none;border:0;cursor:pointer}
input{font:inherit;width:100%;padding:.6em;margin:.3em 0 1em;border:2px solid #999;border-radius:10px}
table{border-collapse:collapse;width:100%;font-size:.9rem}td,th{padding:6px;border-bottom:1px solid #ddd;text-align:left}
.tbl{max-height:60vh;overflow:auto}
.msg{color:#b00020;font-weight:700}
#estado{padding:40px;text-align:center}
</style>
</head>
<body>
<div id="estado">Cargando rifa…</div>
<main id="app" hidden>
  <header class="s1"><div class="wrap">
    <h1 id="nombre"></h1><span class="precio" id="valor"></span>
  </div></header>
  <section class="s2"><div class="wrap"><p class="desc" id="descripcion"></p></div></section>
  <section class="s3"><div class="wrap"><h2>Los premios</h2><div class="grid" id="premios"></div></div></section>
  <section class="s4"><div class="wrap">
    <h2>Elegí tus números</h2>
    <div class="leyenda"><span>Tocá los números disponibles para elegirlos.</span><span id="resumen"></span></div>
    <div class="nums" id="nums"></div>
  </div></section>
  <footer class="s5"><div class="wrap">
    <p>También podés pagar por transferencia al alias <b id="alias"></b> y avisarnos por WhatsApp.</p>
    <button class="btn alt" id="btnVend">Soy vendedor</button>
  </div></footer>
  <div class="bar s5">
    <div><b id="selTxt">Todavía no elegiste números</b></div>
    <div style="display:flex;gap:8px;flex-wrap:wrap">
      <button class="btn" id="btnWa" disabled>Comprar por WhatsApp</button>
      <button class="btn" id="btnReg" hidden>Registrar venta</button>
      <button class="btn alt" id="btnVentas" hidden>Ver ventas</button>
    </div>
  </div>
</main>

<dialog id="dPremio"><button class="x" onclick="this.closest('dialog').close()" aria-label="Cerrar">×</button><img id="pImg" alt=""><div class="dlg"><h2 id="pNom"></h2><p id="pDesc"></p></div></dialog>

<dialog id="dLogin"><div class="dlg"><button class="x" onclick="this.closest('dialog').close()" aria-label="Cerrar">×</button>
  <h2>Ingreso de vendedores</h2><p>Ingresá con tu cuenta de Google habilitada.</p><div id="gbtn"></div><p class="msg" id="loginMsg"></p></div></dialog>

<dialog id="dVenta"><div class="dlg"><button class="x" onclick="this.closest('dialog').close()" aria-label="Cerrar">×</button>
  <h2>Registrar venta</h2><p id="vNums"></p>
  <label>Nombre del comprador<input id="vNom" autocomplete="off"></label>
  <label>Teléfono (opcional)<input id="vTel" inputmode="tel"></label>
  <p class="msg" id="vMsg"></p><button class="btn" style="background:var(--b1);color:var(--t1)" id="vOk">Confirmar venta</button></div></dialog>

<dialog id="dVentas" style="max-width:min(900px,96vw)"><div class="dlg"><button class="x" onclick="this.closest('dialog').close()" aria-label="Cerrar">×</button>
  <h2>Ventas realizadas</h2><p id="vResumen"></p><div class="tbl"><table id="tVentas"></table></div></div></dialog>

<script>
// ⚙️ COMPLETAR antes de publicar:
const API_URL   = 'https://script.google.com/macros/s/AKfycbwY9FdLwOp4F1Ljh8n2PDBRkd9vg-hTdKISBjwVawkTxS9if4fYrRn-tWRoopL6bUjF/exec';
  
const CLIENT_ID = '277244880798-17vrks9slu42j1ooqga2m98d8svd40r6.apps.googleusercontent.com';

const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let D, sold = new Set(), sel = new Set(), token = null;

async function cargar() {
  try {
    D = await (await fetch(API_URL)).json();
    sold = new Set(D.vendidos.map(Number));
    tema(D.config); render();
    $('estado').hidden = true; $('app').hidden = false;
  } catch (e) { $('estado').textContent = 'No pudimos cargar la rifa. Probá recargar la página.'; }
}

function tema(c) {
  const r = document.documentElement.style;
  for (let i = 1; i <= 5; i++) {
    if (c['color_fondo_' + i]) r.setProperty('--b' + i, c['color_fondo_' + i]);
    if (c['color_texto_' + i]) r.setProperty('--t' + i, c['color_texto_' + i]);
  }
  const fam = [[c.fuente_titulo, '--ft'], [c.fuente_texto, '--fx']];
  fam.forEach(([f, v]) => { if (!f) return;
    const l = document.createElement('link'); l.rel = 'stylesheet';
    l.href = 'https://fonts.googleapis.com/css2?family=' + encodeURIComponent(f).replace(/%20/g, '+') + ':wght@400;700;800&display=swap';
    document.head.appendChild(l); r.setProperty(v, `'${f}',system-ui,sans-serif`);
  });
}

function render() {
  const c = D.config;
  document.title = c.nombre;
  $('nombre').textContent = c.nombre;
  $('valor').textContent = 'Cada número ' + c.valor;
  $('descripcion').textContent = c.descripcion;
  $('alias').textContent = c.alias;
  $('premios').innerHTML = D.premios.map((p, i) =>
    `<button class="card" data-i="${i}"><img src="${esc(p.imagen)}" alt="${esc(p.nombre)}" loading="lazy"><b>${esc(p.nombre)}</b></button>`).join('');
  $('premios').onclick = e => { const b = e.target.closest('.card'); if (!b) return;
    const p = D.premios[b.dataset.i]; $('pImg').src = p.imagen; $('pImg').alt = p.nombre;
    $('pNom').textContent = p.nombre; $('pDesc').textContent = p.descripcion; $('dPremio').showModal(); };
  let h = ''; for (let n = 1; n <= D.total; n++) h += `<button class="num" data-n="${n}" aria-label="Número ${n}"></button>`;
  $('nums').innerHTML = h;
  $('nums').onclick = e => { const b = e.target.closest('.num'); if (!b) return; const n = +b.dataset.n;
    if (sold.has(n)) return; sel.has(n) ? sel.delete(n) : sel.add(n); pintar(); };
  pintar();
}

function pintar() {
  document.querySelectorAll('.num').forEach(b => { const n = +b.dataset.n;
    b.textContent = n; b.classList.toggle('sold', sold.has(n)); b.classList.toggle('sel', sel.has(n)); b.disabled = sold.has(n); });
  const arr = [...sel].sort((a, b) => a - b), precio = parseInt(String(D.config.valor).replace(/\D/g, ''), 10) || 0;
  $('resumen').textContent = `Disponibles: ${D.total - sold.size} de ${D.total}`;
  $('selTxt').textContent = arr.length ? `Números: ${arr.join(', ')} · Total $${(precio * arr.length).toLocaleString('es-AR')}` : 'Todavía no elegiste números';
  $('btnWa').disabled = $('btnReg').disabled = !arr.length;
}

$('btnWa').onclick = () => {
  const arr = [...sel].sort((a, b) => a - b);
  let t = String(D.config.telefono).replace(/\D/g, '').replace(/^0/, ''); if (!t.startsWith('54')) t = '549' + t;
  const msg = `Hola! Quiero comprar ${arr.length > 1 ? 'los números' : 'el número'} ${arr.join(', ')} de la ${D.config.nombre}.`;
  window.open(`https://wa.me/${t}?text=${encodeURIComponent(msg)}`, '_blank');
};

/* ----- Vendedores ----- */
async function api(body) {
  const r = await fetch(API_URL, { method: 'POST', body: JSON.stringify({ token, ...body }) }); // text/plain: evita preflight CORS
  return r.json();
}

$('btnVend').onclick = () => {
  $('dLogin').showModal();
  if (window.google && !$('gbtn').hasChildNodes()) {
    google.accounts.id.initialize({ client_id: CLIENT_ID, callback: async resp => {
      token = resp.credential; const r = await api({ action: 'me' });
      if (r.ok) { $('dLogin').close(); $('btnReg').hidden = $('btnVentas').hidden = false; $('btnVend').textContent = 'Vendedor: ' + r.email; $('btnVend').disabled = true; }
      else { token = null; $('loginMsg').textContent = 'Esta cuenta no está habilitada como vendedora.'; } } });
    google.accounts.id.renderButton($('gbtn'), { theme: 'filled_blue', size: 'large', text: 'signin_with' });
  }
};

$('btnReg').onclick = () => { $('vNums').textContent = 'Números: ' + [...sel].sort((a, b) => a - b).join(', '); $('vMsg').textContent = ''; $('dVenta').showModal(); };

$('vOk').onclick = async () => {
  $('vOk').disabled = true; $('vMsg').textContent = '';
  const r = await api({ action: 'sell', numbers: [...sel], buyer: $('vNom').value, phone: $('vTel').value });
  $('vOk').disabled = false;
  if (r.error === 'auth') { $('vMsg').textContent = 'La sesión venció. Recargá la página e ingresá de nuevo.'; return; }
  if (r.error) { $('vMsg').textContent = r.error; if (r.vendidos) sold = new Set(r.vendidos); return; }
  sold = new Set(r.vendidos); sel.clear(); $('vNom').value = $('vTel').value = ''; pintar(); $('dVenta').close();
};

$('btnVentas').onclick = async () => {
  $('dVentas').showModal(); $('vResumen').textContent = 'Cargando…';
  const r = await api({ action: 'sales' });
  if (r.error) { $('vResumen').textContent = 'No se pudieron cargar las ventas (' + r.error + ').'; return; }
  const tot = r.ventas.reduce((s, v) => s + Number(v.total || 0), 0);
  $('vResumen').textContent = `${r.ventas.length} ventas · Recaudado $${tot.toLocaleString('es-AR')}`;
  $('tVentas').innerHTML = '<tr><th>Fecha</th><th>Vendedor</th><th>Números</th><th>Comprador</th><th>Tel.</th><th>Total</th></tr>' +
    r.ventas.map(v => `<tr><td>${esc(new Date(v.fecha).toLocaleString('es-AR'))}</td><td>${esc(v.vendedor)}</td><td>${esc(v.numeros)}</td><td>${esc(v.comprador)}</td><td>${esc(v.telefono)}</td><td>$${esc(v.total)}</td></tr>`).join('');
};

cargar();
</script>
</body>
</html>
